<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohammad Universe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="scene">

    <div class="stars"></div>


    <div class="characters">

        <div class="character left">
            <div class="avatar">
                <div class="face">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>
                    <div class="smile"></div>
                </div>
            </div>

            <span>Mohammad Mahdi</span>
        </div>


        <div class="character right">
            <div class="avatar">
                <div class="face">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>
                    <div class="smile"></div>
                </div>
            </div>

            <span>Alireza</span>
        </div>

    </div>



    <div class="content">

        <h1>
            HAPPY BIRTHDAY, MOHAMMAD ✨
        </h1>


        <p>
            A little piece of the universe,
            just for your special day, Mohammad.
        </p>


        <p>
            With endless love from Mohammad Mehdi & Alireza.
        </p>


        <button>
            Enter Your Universe ✨
        </button>

    </div>


</div>


<script src="js/main.js"></script>

</body>
</html>
